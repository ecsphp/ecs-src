name: Blink Parity

# Runs blink (--blink) and the PHP ECS engine over the same real-world corpora
# and fails when blink's output diverges beyond each corpus's ratchet threshold.
# One matrix entry per corpus; thresholds and sets live in blink/parity/corpora/.
# The company goal is 0% divergence on every corpus, so the thresholds only ever
# go down. The job summary lists every differing file grouped by the ECS checker
# that caused it, so the remaining gap stays visible.

on:
    pull_request:
        paths:
            - 'blink/**'
            - 'src/**'
            - 'packages/**'
            - 'config/**'
            - '.github/workflows/blink_parity.yaml'
    workflow_dispatch: null

jobs:
    parity:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                corpus:
                    - rector-src
                    - mautic
                    - laravel
                    - rector
        name: "parity: ${{ matrix.corpus }}"
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26.6"

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none

            - uses: "ramsey/composer-install@v4"

            - name: "Parity ${{ matrix.corpus }}"
              run: blink/parity/run.sh "blink/parity/corpora/${{ matrix.corpus }}.json"

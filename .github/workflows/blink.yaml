name: Blink

# End-to-end check of --blink: ECS dumps the resolved ecs.php config to JSON and
# hands it to the blink binary, which maps the rules and rewrites the code. This
# builds blink from the local blink/ module, runs --blink --fix over a golden
# fixture, and asserts the output matches the expected result.

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    blink:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   run: composer install --no-progress --ansi

            -
                uses: actions/setup-go@v5
                with:
                    go-version: "1.26.9"

            -
                name: "Build the blink binary from the local blink/ module"
                run: go build -C blink -o /tmp/blink-bin .

            -
                name: "Run --blink --fix over the golden fixture"
                run: |
                    cp -r tests/Blink/Fixture/input /tmp/blink-work
                    ECS_BLINK_BIN=/tmp/blink-bin bin/ecs check /tmp/blink-work --blink --fix \
                        --config=tests/Blink/Fixture/ecs.php --no-progress-bar --ansi || true

            -
                name: "Assert the output matches the expected result"
                run: |
                    if ! diff -r /tmp/blink-work tests/Blink/Fixture/expected; then
                        echo "::error::--blink output does not match the expected fixture"
                        exit 1
                    fi

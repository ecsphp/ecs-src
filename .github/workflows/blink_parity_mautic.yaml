name: Blink Parity (mautic)

# Runs the same ECS config both ways on a real mautic/mautic checkout:
#   bin/ecs check --fix              (PHP engine)
#   bin/ecs check --fix --blink      (ecs-go binary, via --ecs-config)
# on two identical copies, then diffs the resulting trees. This applies every
# prepared set (psr12 + perCs + common + standaloneLine + cleanCode) to measure
# how far blink parity reaches on mautic under the full rule surface.
#
# Informational only: it reports the parity table and per-file divergences to the
# job summary but never fails the build.

on:
    pull_request:
        paths:
            - 'blink/**'
            - 'src/**'
            - 'packages/**'
            - 'config/**'
            - '.github/workflows/blink_parity_mautic.yaml'
    workflow_dispatch: null

jobs:
    blink-parity-mautic:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.26.6"

            - name: Build blink
              working-directory: blink
              run: go build -o /tmp/blink .

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none

            # installs this repository's ECS so parity runs against the code being shipped
            - uses: "ramsey/composer-install@v4"

            - name: Fetch mautic/mautic
              run: git clone --depth 1 https://github.com/mautic/mautic.git /tmp/mautic

            # the ECS config lives inside the checkout so __DIR__ resolves against it;
            # applies every prepared set, no per-fixer skips, to exercise the full surface
            - name: Write the shared ECS config
              run: |
                  cat > /tmp/mautic/ecs.php <<'PHP'
                  <?php

                  declare(strict_types=1);

                  use Symplify\EasyCodingStandard\Config\ECSConfig;

                  return ECSConfig::configure()
                      ->withPaths([
                          __DIR__ . '/app',
                          __DIR__ . '/plugins',
                      ])
                      ->withSkip([
                          '*/node_modules/*',
                          '*/Fixture/*',
                      ])
                      ->withPreparedSets(
                          psr12: true,
                          perCs: true,
                          common: true,
                          standaloneLine: true,
                          cleanCode: true,
                      );
                  PHP
                  cp /tmp/mautic/ecs.php /tmp/mautic/ecs-copy.php

            - name: Two identical copies of the source
              run: |
                  cp -r /tmp/mautic /tmp/ours
                  cp -r /tmp/mautic /tmp/ecs

            - name: Fix with blink (--blink)
              env:
                  ECS_BLINK_BIN: /tmp/blink
              run: bin/ecs check --fix --no-progress-bar --config /tmp/ours/ecs.php --blink || true

            - name: Fix with the PHP engine
              run: bin/ecs check --fix --no-progress-bar --config /tmp/ecs/ecs.php || true

            - name: Compare the two trees
              run: |
                  total=0
                  differ=0
                  differing_files=""
                  for f in $(cd /tmp/ours && find app plugins -name '*.php' | sort); do
                      total=$((total + 1))
                      if ! diff -q "/tmp/ours/$f" "/tmp/ecs/$f" >/dev/null 2>&1; then
                          differ=$((differ + 1))
                          differing_files="$differing_files $f"
                      fi
                  done
                  same=$((total - differ))
                  pct=0
                  [ "$total" -gt 0 ] && pct=$((same * 100 / total))
                  {
                      echo "## blink (--blink) vs PHP ECS on mautic/mautic (all sets)"
                      echo ""
                      echo "Sets applied: psr12 + perCs + common + standaloneLine + cleanCode."
                      echo ""
                      echo "| metric | value |"
                      echo "|---|---|"
                      echo "| files | $total |"
                      echo "| identical output | $same |"
                      echo "| differing output | $differ |"
                      echo "| parity | ${pct}% |"
                      echo ""
                      echo "Informational: this job reports parity but does not fail the build."
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "identical=$same differing=$differ of $total (${pct}% parity)"

                  for f in $differing_files; do
                      {
                          echo ""
                          echo "<details><summary>$f</summary>"
                          echo ""
                          echo '```diff'
                          diff "/tmp/ecs/$f" "/tmp/ours/$f" | head -60 || true
                          echo '```'
                          echo "</details>"
                      } >> "$GITHUB_STEP_SUMMARY"
                      echo "--- $f (< PHP, > blink)"
                      diff "/tmp/ecs/$f" "/tmp/ours/$f" | sed 's/^/    /' | head -60 || true
                  done

                  if [ "$differ" -gt 0 ]; then
                      echo "::notice::--blink output differs from the PHP engine on $differ of $total files (informational, not failing)"
                  fi
